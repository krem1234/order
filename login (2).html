<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Σύνδεση - POS</title>
  <link rel="stylesheet" href="style.css">
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('pos_theme') || 'light'); } catch (e) {}</script>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">☕</div>
      <h1>Σύνδεση</h1>
      <p class="muted">Συνδέσου για να συνεχίσεις</p>
    </div>

    <div id="login-alert" class="alert" style="display:none;"></div>

    <form id="login-form" autocomplete="on">
      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" placeholder="onoma@example.com" required style="margin-bottom:14px;">

      <label class="field-label" for="password">Κωδικός</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required style="margin-bottom:18px;">

      <button type="submit" id="login-btn" class="btn btn-lg btn-block">Σύνδεση</button>
    </form>

    <div style="text-align:center; margin-top:16px;">
      <a href="#" id="forgot-link" class="muted" style="font-size:0.88rem;">Ξέχασες τον κωδικό σου;</a>
    </div>
  </div>

  <script type="module">
    import { auth, ROLE_HOME, fetchProfile } from "./auth.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const alertEl = document.getElementById('login-alert');
    const btn = document.getElementById('login-btn');

    function showAlert(msg, type) {
      alertEl.textContent = msg;
      alertEl.className = 'alert ' + (type === 'ok' ? 'alert-success' : 'alert-danger');
      alertEl.style.display = 'block';
    }

    const ERRORS = {
      'auth/invalid-credential': 'Λάθος email ή κωδικός.',
      'auth/wrong-password': 'Λάθος email ή κωδικός.',
      'auth/user-not-found': 'Λάθος email ή κωδικός.',
      'auth/invalid-email': 'Μη έγκυρο email.',
      'auth/user-disabled': 'Ο λογαριασμός είναι απενεργοποιημένος.',
      'auth/too-many-requests': 'Πολλές αποτυχημένες προσπάθειες. Δοκίμασε ξανά σε λίγο.',
      'auth/network-request-failed': 'Πρόβλημα σύνδεσης στο διαδίκτυο.'
    };

    const reason = new URLSearchParams(location.search).get('reason');
    if (reason === 'disabled') showAlert('Ο λογαριασμός σου είναι ανενεργός ή δεν έχει δικαιώματα. Επικοινώνησε με τον διαχειριστή.');
    if (reason === 'norole') showAlert('Ο λογαριασμός σου δεν έχει ρόλο. Επικοινώνησε με τον διαχειριστή.');

    // Όταν υπάρχει συνδεδεμένος χρήστης (είτε μόλις συνδέθηκε είτε από πριν) πάει στη σελίδα του ρόλου του
    onAuthStateChanged(auth, async (user) => {
      if (!user) { btn.disabled = false; return; }
      btn.disabled = true;
      try {
        const profile = await fetchProfile(user);
        if (!profile || profile.active === false || !ROLE_HOME[profile.role]) {
          await signOut(auth);
          showAlert('Ο λογαριασμός σου είναι ανενεργός ή δεν έχει δικαιώματα. Επικοινώνησε με τον διαχειριστή.');
          btn.disabled = false;
          return;
        }
        location.replace(ROLE_HOME[profile.role]);
      } catch (e) {
        console.error(e);
        await signOut(auth);
        showAlert('Δεν ήταν δυνατή η ανάγνωση του προφίλ σου. Δοκίμασε ξανά ή επικοινώνησε με τον διαχειριστή.');
        btn.disabled = false;
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      btn.disabled = true;
      btn.textContent = 'Σύνδεση...';
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Η ανακατεύθυνση γίνεται από το onAuthStateChanged
      } catch (err) {
        console.error(err);
        showAlert(ERRORS[err.code] || 'Αποτυχία σύνδεσης. Δοκίμασε ξανά.');
        btn.disabled = false;
      } finally {
        btn.textContent = 'Σύνδεση';
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return showAlert('Γράψε πρώτα το email σου στο πεδίο παραπάνω.');
      try {
        await sendPasswordResetEmail(auth, email);
        showAlert('Αν υπάρχει λογαριασμός με αυτό το email, στάλθηκε σύνδεσμος επαναφοράς κωδικού.', 'ok');
      } catch (err) {
        console.error(err);
        showAlert(ERRORS[err.code] || 'Δεν ήταν δυνατή η αποστολή. Δοκίμασε ξανά.');
      }
    });
  </script>
</body>
</html>
